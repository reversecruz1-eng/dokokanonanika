<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:"Hiragino Sans","Yu Gothic UI",sans-serif;user-select:none}
  #stage{position:absolute;inset:0}
  .char{position:absolute;bottom:20px;-webkit-app-region:drag;text-align:center}
  .char .body{font-size:72px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
  .char .name{font-size:11px;color:#fff;background:rgba(0,0,0,.45);border-radius:8px;padding:1px 8px}
  #kotori{left:30px} #noise{right:30px}
  #noise .body{filter:grayscale(1) brightness(.5) drop-shadow(0 4px 6px rgba(0,0,0,.4))}
  .bubble{position:absolute;max-width:190px;padding:8px 10px;border-radius:12px;font-size:13px;
    background:#fffdf5;color:#222;box-shadow:0 2px 8px rgba(0,0,0,.3);display:none;-webkit-app-region:no-drag}
  #b-kotori{left:10px;bottom:120px}
  #b-noise{right:10px;bottom:190px;background:#2a2d34;color:#eee}
  #ui{position:absolute;top:6px;right:6px;display:flex;gap:4px;-webkit-app-region:no-drag}
  #ui button{border:0;border-radius:10px;padding:4px 8px;background:rgba(0,0,0,.5);color:#fff;cursor:pointer;font-size:12px}
</style></head>
<body><div id="stage">
  <div id="ui"><button id="talk">💬 話す</button><button id="quit">×</button></div>
  <div class="bubble" id="b-kotori"></div>
  <div class="bubble" id="b-noise"></div>
  <div class="char" id="kotori"><div class="body">🐤</div><span class="name">ことり</span></div>
  <div class="char" id="noise"><div class="body">🐈‍⬛</div><span class="name">ノイズ</span></div>
</div>
<script>
const FALLBACK = [
  [["kotori","ねえねえ、ちょっと休憩しない？"],["noise","止めても無駄やろ。聞くだけ聞いたり"]],
  [["noise","AI世代にまたこれか…ええんか？"],["kotori","えっ、何が？ わたしたち古い？"]],
  [["kotori","今なにしてるの？ 気になる！"],["noise","覗き見すな。……まあ、俺も気になるけど"]],
  [["noise","水、飲んだか？"],["kotori","ノイズが心配してる…！"]],
];
// Electron以外(スマホのブラウザ等)ではpreloadがないので、固定セリフで動かす
const api = window.kn || { talk: async () => null, quit: () => {} };
let history = [];
let busy = false;

function timeHint() {
  const h = new Date().getHours();
  const t = h < 5 ? '深夜' : h < 11 ? '朝' : h < 17 ? '昼' : h < 22 ? '夜' : '夜更け';
  return `現在は${t}(${h}時)。ユーザーに自然に話しかけて。`;
}

function say(who, text, ms) {
  return new Promise(res => {
    const b = document.getElementById('b-' + who);
    b.textContent = text; b.style.display = 'block';
    setTimeout(() => { b.style.display = 'none'; res(); }, ms);
  });
}

async function play(lines) {
  for (const l of lines) {
    const who = l.who || l[0], text = l.text || l[1];
    await say(who, text, 2500 + text.length * 120);
  }
}

async function chat(hint) {
  if (busy) return;
  busy = true;
  try {
    let lines = await api.talk({ hint, history });
    if (!lines) lines = FALLBACK[Math.floor(Math.random() * FALLBACK.length)];
    history.push({ role: 'user', content: hint });
    history.push({ role: 'assistant', content: JSON.stringify(lines) });
    history = history.slice(-8);
    await play(lines);
  } catch (e) {
    console.error(e);
  } finally {
    busy = false;
  }
}

document.getElementById('talk').onclick = () => chat(timeHint() + 'ユーザーが話しかけてきた。');
document.getElementById('quit').onclick = () => api.quit();
document.querySelectorAll('.char').forEach(c => c.onclick = () => chat(timeHint() + 'ユーザーがキャラをタップした。'));
if (!window.kn) document.getElementById('quit').style.display = 'none';

function scheduleRandom() {
  setTimeout(async () => { await chat(timeHint()); scheduleRandom(); },
    (45 + Math.random() * 90) * 1000);
}
setTimeout(() => chat('起動直後。軽く挨拶して。' + timeHint()), 800);
scheduleRandom();
</script></body></html>
